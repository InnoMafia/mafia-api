name: innomafia

services:
  api:
    image: ${API_IMAGE:-mafia-api:local}
    build:
      context: ..
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    environment:
      HTTP_ADDR: ":8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
    ports:
      - "${API_PUBLISH:-127.0.0.1:8080}:8080"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: ${STOP_GRACE_PERIOD:-15s}
