name: API CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: 1.75.0
      - name: Verify generated RPC, gateway and OpenAPI
        run: |
          make generate
          git diff --exit-code -- gen/go internal/handler/openapi
          test -z "$(git ls-files --others --exclude-standard -- gen/go internal/handler/openapi)"
      - run: make check
      - run: docker build .
